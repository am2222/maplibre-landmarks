<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tree seasons</title>
    <style>
      html,
      body,
      #map {
        margin: 0;
        width: 100%;
        height: 100%;
      }
      .panel {
        position: absolute;
        left: 10px;
        top: 10px;
        display: flex;
        flex-wrap: wrap;
        gap: 8px 12px;
        align-items: center;
        max-width: calc(100% - 40px);
        padding: 8px 10px;
        border-radius: 8px;
        background: #fffe;
        box-shadow: 0 1px 4px #0003;
        font:
          13px system-ui,
          sans-serif;
        color: #1c2520;
      }
      .seg {
        display: inline-flex;
        border: 1px solid #c9d2cb;
        border-radius: 6px;
        overflow: hidden;
      }
      .seg button {
        font: inherit;
        border: 0;
        padding: 4px 9px;
        background: transparent;
        cursor: pointer;
      }
      .seg button + button {
        border-left: 1px solid #c9d2cb;
      }
      .seg button[aria-pressed='true'] {
        background: #3f6b3a;
        color: #fff;
      }
      .panel input[type='range'] {
        width: 140px;
        accent-color: #3f6b3a;
      }
      .panel label {
        display: inline-flex;
        gap: 4px;
        align-items: center;
      }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <div class="panel">
      <div class="seg" id="seasons" role="group" aria-label="Season">
        <button type="button" data-season="spring">Spring</button>
        <button type="button" data-season="summer">Summer</button>
        <button type="button" data-season="autumn" aria-pressed="true">Autumn</button>
        <button type="button" data-season="winter">Winter</button>
      </div>
      <input
        id="scrub"
        type="range"
        min="0"
        max="4"
        step="0.01"
        value="2"
        aria-label="Time of year"
      />
      <button type="button" id="play">Play year</button>
      <label><input type="checkbox" id="snow" checked /> Snow</label>
      <select id="theme" aria-label="Theme">
        <option value="day">Day</option>
        <option value="dawn">Dawn</option>
        <option value="dusk">Dusk</option>
        <option value="night">Night</option>
      </select>
    </div>
    <script type="module" src="./tree-seasons.ts"></script>
  </body>
</html>
