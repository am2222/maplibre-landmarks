<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>maplibre-landmarks demo</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="map"></div>
    <aside id="panel">
      <h1>Open Landmarks</h1>
      <label
        >Channel
        <select id="channel">
          <option value="latest">latest (approved)</option>
          <option value="preview">preview (drafts)</option>
        </select>
      </label>
      <label
        >Theme
        <select id="theme">
          <option>day</option>
          <option>dawn</option>
          <option>dusk</option>
          <option>night</option>
        </select>
      </label>
      <label>Wind <input id="wind" type="range" min="0" max="2" step="0.1" value="1" /></label>
      <label><input type="checkbox" id="show-landmarks" checked /> Landmarks</label>
      <label><input type="checkbox" id="show-roofs" checked /> Roofs</label>
      <label><input type="checkbox" id="show-trees" checked /> Trees</label>
      <label><input type="checkbox" id="show-water" checked /> Water</label>
      <label><input type="checkbox" id="show-fog" /> Fog</label>
      <label
        >Fog density <input id="fog-density" type="range" min="0" max="2" step="0.05" value="0.6"
      /></label>
      <label><input type="checkbox" id="terrain" /> Terrain</label>
      <p class="views">
        <button id="view-paris">Paris</button>
        <button id="view-chamonix">Chamonix</button>
      </p>
      <label><input type="checkbox" id="occlusion" checked /> Hide labels behind 3D</label>
      <p id="stats"></p>
      <h2>Loaded models</h2>
      <ul id="models"></ul>
    </aside>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
