<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Compare with OSM2World</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        font:
          13px system-ui,
          sans-serif;
      }
      body {
        overflow: hidden;
        display: grid;
        grid-template-columns: 1fr 1fr;
        grid-template-rows: 100%;
      }
      @media (max-width: 800px) {
        body {
          grid-template-columns: 100%;
          grid-template-rows: 1fr 1fr;
        }
      }
      .pane {
        position: relative;
        overflow: hidden;
        min-width: 0;
        min-height: 0;
      }
      #map,
      #osm2world {
        width: 100%;
        height: 100%;
        border: 0;
        display: block;
      }
      #osm2world {
        border-left: 2px solid #333;
      }
      .tag {
        position: absolute;
        top: 8px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 2;
        background: #fffe;
        padding: 3px 10px;
        border-radius: 12px;
        box-shadow: 0 1px 3px #0003;
        white-space: nowrap;
      }
      .inspect-toggle {
        position: absolute;
        top: 8px;
        left: 8px;
        z-index: 3;
        font: inherit;
        padding: 4px 10px;
        border: 1px solid #0003;
        border-radius: 12px;
        background: #fffe;
        box-shadow: 0 1px 3px #0003;
        cursor: pointer;
      }
      .inspect-toggle.on {
        background: #d33;
        color: #fff;
      }
      .inspector {
        position: absolute;
        top: 40px;
        left: 8px;
        bottom: 8px;
        z-index: 3;
        width: min(440px, calc(100% - 16px));
        overflow: auto;
        background: #fffffff2;
        border-radius: 8px;
        box-shadow: 0 2px 8px #0004;
        padding: 0 10px 10px;
        font-size: 12px;
      }
      .inspector header {
        position: sticky;
        top: 0;
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: inherit;
        padding: 8px 0 4px;
      }
      .inspector .close {
        border: 0;
        background: none;
        font-size: 18px;
        cursor: pointer;
      }
      .inspector .card {
        border-top: 1px solid #0002;
        padding-top: 6px;
        margin-top: 6px;
      }
      .inspector h3 {
        margin: 0 0 2px;
        font-size: 13px;
      }
      .inspector .sub {
        color: #555;
        margin: 2px 0 6px;
      }
      .inspector table {
        border-collapse: collapse;
        width: 100%;
        margin: 4px 0;
      }
      .inspector th,
      .inspector td {
        text-align: left;
        padding: 1px 6px 1px 0;
        vertical-align: top;
      }
      .inspector .heights td,
      .inspector .heights th:not(:first-child) {
        text-align: right;
      }
      .inspector .why td {
        color: #666;
        font-size: 11px;
      }
      .inspector .diff,
      .inspector td.diff {
        background: #fde2e2;
      }
      .inspector .findings {
        margin: 4px 0;
        padding-left: 16px;
      }
      .inspector .bad {
        color: #b00;
      }
      .inspector .warn {
        color: #8a5a00;
      }
      .inspector .info {
        color: #335;
      }
      .inspector .ok {
        color: #070;
      }
      .inspector pre {
        white-space: pre-wrap;
        font-size: 11px;
        background: #f4f4f4;
        padding: 4px;
      }
    </style>
  </head>
  <body>
    <div class="pane">
      <div class="tag">maplibre-landmarks</div>
      <div id="map"></div>
    </div>
    <div class="pane">
      <div class="tag" id="o2w-tag">
        <a href="https://osm2world.org" target="_blank" rel="noopener">OSM2World</a> · ©
        OpenStreetMap, 3DMR
      </div>
      <canvas id="osm2world" aria-label="OSM2World 3D map" touch-action="none"></canvas>
    </div>
    <script type="module" src="./compare.ts"></script>
  </body>
</html>
