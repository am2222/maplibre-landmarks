name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
      # Without a Protomaps key the demo shows its "set a key" note; the build still has to pass.
      - run: npm run docs:build
      - run: npm run docs:check

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Fixed local scenes only: the landmarks and labels tests call the Open Landmarks API,
      # which rate-limits test runs.
      - run: npx playwright test tests/browser/water.pw.ts tests/browser/fog.pw.ts tests/browser/roofs.pw.ts
