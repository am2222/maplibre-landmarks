name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance and trusted publishing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      # Trusted publishing (OIDC) needs npm 11.5.1 or newer; Node 22 ships npm 10. Pinned to 11:
      # npm 12 requires Node 22.22.2+.
      - run: npm install -g npm@11
      # The first version is published by hand (a trusted publisher can only be added to a
      # package that exists): skip a version that is already on npm.
      - id: published
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "maplibre-landmarks@$version" version >/dev/null 2>&1; then
            echo "maplibre-landmarks@$version is already on npm: skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.published.outputs.skip != 'true'
        run: npm ci
      - if: steps.published.outputs.skip != 'true'
        run: npm test
      # Trusted publishing (OIDC): no token; provenance is generated automatically.
      - if: steps.published.outputs.skip != 'true'
        run: npm publish --access public
